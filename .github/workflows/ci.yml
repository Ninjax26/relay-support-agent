name: Agent checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python evals.py
      - run: python scripts/benchmark_jobs.py --jobs 20 --workers 2
      - run: python scripts/check_publish.py --tracked
